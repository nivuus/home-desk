[pytest]
# `make test-composant` invoke pytest avec un chemin absolu
# ($(PACKAGE_DIR)/tests/composant) : le rootdir qu'il deduirait seul
# depend alors du repertoire d'ou `make` est lance, pas de ce depot. Ce
# fichier fixe le rootdir ICI (racine du package), et `pythonpath = .`
# ajoute cette racine a sys.path — sans quoi
# `from custom_components.home_desk.schema import ...` echoue pour une
# raison sans rapport avec le code teste, puisque `custom_components/`
# n'est visible que depuis la racine du depot.
pythonpath = .

# pytest-homeassistant-custom-component pose une fixture async autouse
# (configure_event_loop) ; sans asyncio_mode = auto, pytest-asyncio la
# rejette ("PytestRemovedIn9Warning ... requested an async fixture ... with
# no plugin or hook that handled it") pour une raison qui n'a rien a voir
# avec le code teste. C'est la config que le paquet documente lui-meme dans
# son README (issues #129 et #247 de MatthewFlamm/pytest-homeassistant-custom-component).
asyncio_mode = auto
