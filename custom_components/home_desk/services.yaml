# Les noms/descriptions affiches par l'interface viennent des traductions
# (translations/fr.json, translations/en.json, cle "services") -- pas d'ici,
# c'est l'idiome actuel de Home Assistant (name/description directement
# dans ce fichier est deprecie depuis la 2023.8). Ce fichier ne porte donc
# que ce que les traductions NE PEUVENT PAS porter : la FORME de chaque
# service. Aucun champ pour les deux : voir services.py pour pourquoi.
exporter: {}
importer: {}
jouer_animation:
  fields:
    ecrans:
      required: true
      example: ["Salon"]
      selector:
        text:
          multiple: true
    media:
      required: true
      selector:
        media:
          accept:
            - "video/*"
            - "image/*"
    duree:
      required: false
      selector:
        # The contract is ]0, 120] s, sent in whole milliseconds: 0.1 s is
        # the smallest step the editor offers. A box, not a slider: a
        # 1200-step slider cannot land on an exact value.
        number:
          min: 0.1
          max: 120
          step: 0.1
          unit_of_measurement: s
          mode: box
    fond:
      required: false
      default: noir
      selector:
        select:
          options:
            - noir
            - transparent
